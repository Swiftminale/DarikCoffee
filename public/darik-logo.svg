<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1A10" />
      <stop offset="85%" stop-color="#180C06" />
      <stop offset="100%" stop-color="#0E0603" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184" />
      <stop offset="50%" stop-color="#C88A36" />
      <stop offset="100%" stop-color="#8F5614" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C88A36" flood-opacity="0.3"/>
    </filter>
    <path id="textArcTop" d="M 68 200 A 132 132 0 1 1 332 200" fill="none" />
    <path id="textArcBottom" d="M 324 200 A 124 124 0 0 1 76 200" fill="none" />
  </defs>

  <!-- Outer Scalloped Gear/Wreath Border -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4">
    <!-- Outer ornate ring -->
    <circle cx="200" cy="200" r="188" stroke-dasharray="8 6" stroke-width="3" opacity="0.85" />
    <circle cx="200" cy="200" r="176" stroke-width="3.5" />
    <circle cx="200" cy="200" r="132" stroke-width="2.5" />
    <circle cx="200" cy="200" r="126" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Inner Seal Background -->
  <circle cx="200" cy="200" r="125" fill="url(#sealGrad)" />

  <!-- Circular Text in Ge'ez (Amharic) and English -->
  <text font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="19" letter-spacing="4" fill="url(#goldGrad)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      ዳሪክ ቡና • DARIK COFFEE
    </textPath>
  </text>

  <text font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" letter-spacing="5" fill="#E6DCCD" opacity="0.9">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ ARTISANAL ETHIOPIAN ROAST ★
    </textPath>
  </text>

  <!-- Center Roaring Lion Emblem (Royal Lion of Ethiopia) -->
  <g transform="translate(115, 115) scale(0.85)" fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Lion Head & Mane Silhouette with intricate contours -->
    <path d="M100 15 C85 15, 65 30, 52 48 C42 63, 35 82, 38 102 C30 96, 22 108, 25 120 C27 128, 35 133, 42 135 C38 145, 40 158, 48 165 C55 172, 68 170, 75 165 C78 178, 92 188, 106 185 C115 183, 122 176, 126 168 C135 175, 148 174, 155 166 C162 158, 162 146, 158 136 C166 132, 172 122, 172 112 C172 100, 163 92, 155 96 C160 78, 150 58, 138 45 C125 30, 112 15, 100 15 Z" opacity="0.95"/>
    
    <!-- Inner Facial Carvings (Roaring Jaw, Eyes, Snarl) in dark negative space -->
    <g fill="#180C06">
      <!-- Left Eye -->
      <path d="M72 78 C76 74, 84 75, 87 80 C84 83, 76 83, 72 78 Z" />
      <!-- Right Eye -->
      <path d="M112 80 C115 75, 123 74, 127 78 C123 83, 115 83, 112 80 Z" />
      <!-- Brow wrinkles -->
      <path d="M82 72 Q99 68 117 72 Q99 64 82 72 Z" />
      <path d="M94 72 L96 90 L103 90 L105 72 Z" />
      <!-- Nose bridge & nostrils -->
      <path d="M93 92 C91 100, 86 106, 92 112 C96 116, 103 116, 107 112 C113 106, 108 100, 106 92 Z" />
      <!-- Open Roaring Mouth & Fangs -->
      <path d="M74 122 C82 115, 117 115, 125 122 C130 135, 126 156, 100 158 C74 156, 70 135, 74 122 Z" />
    </g>

    <!-- Teeth & Tongue Highlights -->
    <g fill="url(#goldGrad)">
      <!-- Upper Fangs -->
      <polygon points="80,121 86,121 83,132" />
      <polygon points="113,121 119,121 116,132" />
      <polygon points="88,121 93,121 90.5,127" />
      <polygon points="95,121 100,121 97.5,127" />
      <polygon points="102,121 107,121 104.5,127" />
      <polygon points="108,121 113,121 110.5,127" />
      <!-- Lower Fangs -->
      <polygon points="82,154 87,154 84.5,143" />
      <polygon points="112,154 117,154 114.5,143" />
      <!-- Tongue line -->
      <path d="M93 148 Q99 144 106 148 Q99 152 93 148 Z" fill="#9A6218" />
    </g>

    <!-- Whisker details and crown crest -->
    <path d="M60 115 L40 112 M58 122 L36 124 M62 130 L42 136" stroke="#180C06" stroke-width="2.5" stroke-linecap="round" />
    <path d="M138 115 L158 112 M140 122 L162 124 M136 130 L156 136" stroke="#180C06" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Crown Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="200,42 203,50 211,50 205,55 207,63 200,58 193,63 195,55 189,50 197,50" transform="scale(0.8) translate(50, 8)" />
  </g>
</svg>
